name: dart_define
description: Utility for generating and populating dart-define config files
version: 2.1.2
homepage: https://mankeli.co
repository: https://github.com/Mankeli-Software/dart_define

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.4.1
  checked_yaml: ^2.0.3
  cli_completion: ^0.5.0
  cmd_plus: ^1.3.4
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  mankeli_core: ^0.0.6
  mustache_template: ^2.0.0
  path: ^1.8.3
  pub_updater: ^0.5.0
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.0.0
  build_verify: ^3.0.0
  build_version: ^2.0.0
  freezed: ^3.0.0
  json_serializable: ^6.6.2
  mankeli_analysis: ^1.1.2
  mocktail: ^1.0.4
  test: ^1.19.2

executables:
  dart_define:

scripts:
  gen:
    code: flutter pub run build_runner build --delete-conflicting-outputs
